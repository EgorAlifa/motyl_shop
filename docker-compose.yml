services:
  postgres:
    image: postgres:16-alpine
    container_name: motyl_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: motyluser
      POSTGRES_PASSWORD: motylpass
      POSTGRES_DB: motylshop
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init-keycloak-db.sh:/docker-entrypoint-initdb.d/init-keycloak-db.sh
    networks:
      - motyl_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U motyluser -d motylshop"]
      interval: 10s
      timeout: 5s
      retries: 5

  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    container_name: motyl_keycloak
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: motyluser
      KC_DB_PASSWORD: motylpass
      KC_HOSTNAME_URL: https://${DOMAIN:-localhost}/auth
      KC_HOSTNAME_STRICT: false
      KC_PROXY: edge
      KC_PROXY_HEADERS: xforwarded
      KC_HTTP_ENABLED: true
      KC_HTTP_RELATIVE_PATH: /auth
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin123}
    ports:
      - "8080:8080"
    networks:
      - motyl_network
    command: start
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/8080 && exit 0 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: motyl_app
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      keycloak:
        condition: service_healthy
    extra_hosts:
      - "${DOMAIN:-localhost}:host-gateway"
    environment:
      DOMAIN: ${DOMAIN:-localhost}
      DATABASE_URL: postgresql://motyluser:motylpass@postgres:5432/motylshop
      KEYCLOAK_URL: http://keycloak:8080/auth
      NEXT_PUBLIC_KEYCLOAK_URL: https://${DOMAIN:-localhost}/auth
      KEYCLOAK_REALM: motyl-shop
      KEYCLOAK_CLIENT_ID: motyl-admin
      KEYCLOAK_CLIENT_SECRET: ${KEYCLOAK_CLIENT_SECRET:-your-client-secret}
      SMTP_HOST: ${SMTP_HOST:-smtp.gmail.com}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASSWORD: ${SMTP_PASSWORD}
      SMTP_FROM: ${SMTP_FROM}
      ADMIN_EMAIL: ${ADMIN_EMAIL}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin123}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:-your-secret-key-change-in-production}
      NEXTAUTH_URL: ${NEXTAUTH_URL:-https://localhost:3000}
      NODE_TLS_REJECT_UNAUTHORIZED: '0'
    volumes:
      - uploads_data:/app/public/uploads
    networks:
      - motyl_network
    command: sh -c "prisma db push --skip-generate && prisma db seed && node server.js"

  nginx:
    image: nginx:alpine
    container_name: motyl_nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./cert:/etc/nginx/ssl:ro
      - uploads_data:/usr/share/nginx/html/uploads:ro
    depends_on:
      - app
    networks:
      - motyl_network

volumes:
  postgres_data:
  uploads_data:

networks:
  motyl_network:
    driver: bridge
